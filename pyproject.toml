[project]
name = "zipvoice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cn2an>=0.5.23",
    "espnet-tts-frontend>=0.0.3",
    "hnet-impl[build]",
    "jieba>=0.42.1",
    "lhotse[orjson]>=1.30.3",
    "matplotlib>=3.10.5",
    "psutil>=7.0.0",
    "pypinyin>=0.55.0",
    "tensorboard>=2.20.0",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "triton>=3.3.1",
    "vocos>=0.1.0",
    "wandb>=0.21.0",
    "hnet",
    "librosa>=0.11.0",
    "s3prl>=0.4.18",
    "jiwer==3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zipvoice"]

[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "packaging",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
build = ["mamba-ssm", "flash-attn <= 2.8.2", "causal-conv1d"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "mamba-ssm", "causal-conv1d"]

[tool.uv.sources]
# hnet-impl = { git = "https://github.com/main-horse/hnet-impl", rev = "master" }
hnet-impl= { git = "https://github.com/txya900619/hnet-impl", rev = "innermost_prefix" }
hnet = { git = "https://github.com/txya900619/hnet", rev = "fix-deps" }

